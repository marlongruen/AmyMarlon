<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>🍻 Urlaubs-Alkohol-Counter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f5d76e, #e8a33d);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 20px;
  }
  .wrapper {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 820px;
  }
  .card {
    background: #fffbe9;
    border-radius: 24px;
    padding: 32px 34px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    max-width: 360px;
    width: 100%;
    flex: 1 1 320px;
  }
  .card.pink { background: #fdeef3; }
  h1 { margin: 0 0 4px; font-size: 1.4em; color: #7a4a12; }
  .pink h1 { color: #8a2f57; }
  .sub { color: #9a6a2e; font-size: 0.82em; margin-bottom: 18px; }
  .pink .sub { color: #a85678; }
  .count { font-size: 3.6em; font-weight: bold; color: #b8722a; margin: 4px 0; user-select: none; line-height: 1; }
  .pink .count { color: #c94f80; }
  .label { color: #9a6a2e; margin-bottom: 16px; font-size: 0.9em; }
  .pink .label { color: #a85678; }
  .stats { background: #fff3d6; border-radius: 14px; padding: 12px 14px; margin: 14px 0; text-align: left; font-size: 0.88em; color: #6b4a1a; }
  .pink .stats { background: #fbe0e9; color: #7a3552; }
  .stats div { display: flex; justify-content: space-between; padding: 3px 0; }
  .stats strong { color: #7a4a12; }
  .pink .stats strong { color: #8a2f57; }
  .inputs { display: flex; gap: 8px; margin: 12px 0; }
  .inputs label { flex: 1; text-align: left; font-size: 0.78em; color: #7a4a12; }
  .pink .inputs label { color: #8a2f57; }
  .inputs input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #d9b06a; border-radius: 8px; font-size: 1em; }
  .pink .inputs input { border-color: #e6a8c4; }
  button { border: none; border-radius: 16px; padding: 16px 26px; font-size: 1.2em; cursor: pointer; margin: 5px; transition: transform 0.1s ease, box-shadow 0.1s ease; }
  button:active { transform: scale(0.95); }
  .plus { background: #d99a2b; color: white; box-shadow: 0 6px 0 #a8721a; }
  .plus:active { box-shadow: 0 2px 0 #a8721a; }
  .pink .plus { background: #d9527f; box-shadow: 0 6px 0 #a83a5e; }
  .pink .plus:active { box-shadow: 0 2px 0 #a83a5e; }
  .minus { background: #eee; color: #7a4a12; box-shadow: 0 6px 0 #ccc; font-size: 0.95em; padding: 11px 20px; }
  .minus:active { box-shadow: 0 2px 0 #ccc; }
  .pink .minus { color: #8a2f57; }
  .reset { display: block; margin: 14px auto 0; background: none; color: #b06a1a; text-decoration: underline; box-shadow: none; font-size: 0.82em; padding: 4px; }
  .pink .reset { color: #b0507a; }
</style>
</head>
<body>

<div class="wrapper">

  <!-- LINKS: DU -->
  <div class="card" id="mine-card">
    <h1>🍺 Dein Alkohol</h1>
    <div class="sub">Für jedes Getränk Menge & Stärke eintragen</div>

    <div class="count" id="mine-count">0</div>
    <div class="label">Getränke insgesamt</div>

    <div class="inputs">
      <label>Menge (ml)
        <input type="number" id="mine-volume" min="1" step="10" value="500">
      </label>
      <label>Alkohol (%)
        <input type="number" id="mine-abv" min="0" max="100" step="0.1" value="5">
      </label>
    </div>

    <div>
      <button class="minus" id="mine-minus">−1</button>
      <button class="plus" id="mine-plus">+1 🍺</button>
    </div>

    <div class="stats">
      <div><span>Reiner Alkohol:</span> <strong id="mine-mg">0 mg</strong></div>
      <div><span>(entspricht)</span> <strong id="mine-g">0 g</strong></div>
    </div>

    <button class="reset" id="mine-reset">Zurücksetzen</button>
  </div>

  <!-- RECHTS: FREUNDIN -->
  <div class="card pink" id="partner-card">
    <h1>🍷 Ihr Alkohol</h1>
    <div class="sub">Für jedes Getränk Menge & Stärke eintragen</div>

    <div class="count" id="partner-count">0</div>
    <div class="label">Getränke insgesamt</div>

    <div class="inputs">
      <label>Menge (ml)
        <input type="number" id="partner-volume" min="1" step="10" value="200">
      </label>
      <label>Alkohol (%)
        <input type="number" id="partner-abv" min="0" max="100" step="0.1" value="12">
      </label>
    </div>

    <div>
      <button class="minus" id="partner-minus">−1</button>
      <button class="plus" id="partner-plus">+1 🥂</button>
    </div>

    <div class="stats">
      <div><span>Reiner Alkohol:</span> <strong id="partner-mg">0 mg</strong></div>
      <div><span>(entspricht)</span> <strong id="partner-g">0 g</strong></div>
    </div>

    <button class="reset" id="partner-reset">Zurücksetzen</button>
  </div>

</div>

<script>
  const ETHANOL_DICHTE = 0.789; // g/ml

  function alkoholInMg(volumeMl, abvPercent) {
    const gramm = volumeMl * (abvPercent / 100) * ETHANOL_DICHTE;
    return gramm * 1000;
  }
  function formatMg(mg) { return Math.round(mg).toLocaleString('de-DE') + ' mg'; }
  function formatG(mg) { return (mg / 1000).toFixed(1).replace('.', ',') + ' g'; }

  // Erzeugt einen unabhängigen Tracker mit eigenem Prefix (= eigene localStorage-Keys)
  function createTracker(prefix, storageKeyPrefix) {
    const countEl = document.getElementById(prefix + '-count');
    const mgEl = document.getElementById(prefix + '-mg');
    const gEl = document.getElementById(prefix + '-g');
    const plusBtn = document.getElementById(prefix + '-plus');
    const minusBtn = document.getElementById(prefix + '-minus');
    const resetBtn = document.getElementById(prefix + '-reset');
    const volumeInput = document.getElementById(prefix + '-volume');
    const abvInput = document.getElementById(prefix + '-abv');

    let count = parseInt(localStorage.getItem(storageKeyPrefix + 'Count')) || 0;
    let totalMg = parseFloat(localStorage.getItem(storageKeyPrefix + 'TotalMg')) || 0;
    volumeInput.value = localStorage.getItem(storageKeyPrefix + 'LastVolume') || volumeInput.value;
    abvInput.value = localStorage.getItem(storageKeyPrefix + 'LastAbv') || abvInput.value;

    function render() {
      countEl.textContent = count;
      mgEl.textContent = formatMg(totalMg);
      gEl.textContent = formatG(totalMg);
    }
    function save() {
      localStorage.setItem(storageKeyPrefix + 'Count', count);
      localStorage.setItem(storageKeyPrefix + 'TotalMg', totalMg);
      localStorage.setItem(storageKeyPrefix + 'LastVolume', volumeInput.value);
      localStorage.setItem(storageKeyPrefix + 'LastAbv', abvInput.value);
    }

    plusBtn.addEventListener('click', () => {
      const v = parseFloat(volumeInput.value) || 0;
      const a = parseFloat(abvInput.value) || 0;
      count++;
      totalMg += alkoholInMg(v, a);
      render();
      save();
    });

    minusBtn.addEventListener('click', () => {
      if (count > 0) {
        const v = parseFloat(volumeInput.value) || 0;
        const a = parseFloat(abvInput.value) || 0;
        count--;
        totalMg = Math.max(0, totalMg - alkoholInMg(v, a));
        render();
        save();
      }
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Zähler wirklich zurücksetzen?')) {
        count = 0;
        totalMg = 0;
        render();
        save();
      }
    });

    volumeInput.addEventListener('change', save);
    abvInput.addEventListener('change', save);

    render();
  }

  // Dein Tracker: komplett neue Keys (unabhängig vom alten Bier-Counter)
  createTracker('mine', 'urlaubMarlonAlk');

  // Tracker deiner Freundin: eigene Keys, unabhängig von deinem
  createTracker('partner', 'urlaubPartnerAlk');
</script>

</body>
</html>
